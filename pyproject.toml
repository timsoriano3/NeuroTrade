[project]
name = "neurotrade"
version = "0.0.0"
description = "Autonomous day-trading system for US and Canadian equities"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# Every dependency is added by the commit that introduces the code needing it,
# so `git log -p pyproject.toml` reads as a history of why each one is here.
dependencies = [
    "duckdb>=1.5.5",
    "exchange-calendars>=4.13.2",
    "ib-async>=2.1.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",          # typed settings and validation
    "pydantic-settings>=2.15.0", # profile + environment layering
    "pyyaml>=6.0.3",             # profile files
    "structlog>=26.1.0",
    "typer>=0.27.1",
]

[project.scripts]
neurotrade = "neurotrade.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.6.1",
    "types-pyyaml",
    "import-linter>=2.13",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotrade"]

[tool.uv]
default-groups = ["dev"]

# ── Lint & format ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "TID",      # tidy imports
    "RUF",
    "ANN",      # missing annotations
    "DTZ",      # naive datetimes — see the wall-clock invariant in CLAUDE.md
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ── Types ────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "conftest.py"]
strict = true
# Teaches mypy about pydantic models: validates constructor calls and
# enforces frozen-model assignment rules that are otherwise invisible.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pyarrow ships no py.typed marker. Declared once here rather than
# suppressed at every import site.
module = ["pyarrow.*"]
ignore_missing_imports = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Neither ships a py.typed marker either. pandas appears only as the type of the
# timestamps exchange_calendars hands back; nothing in this codebase computes
# with it.
module = ["exchange_calendars.*", "pandas.*"]
ignore_missing_imports = true

# ── Tests ────────────────────────────────────────────────────
[tool.pytest.ini_options]
# src is included so the `>>>` examples in docstrings run as tests. An example
# nobody executes drifts out of date and then actively misleads.
testpaths = ["tests", "src"]
# `not ibkr` by default: those tests need IB Gateway logged in, which CI does
# not have and a laptop usually does not either. Run them with `-m ibkr`.
addopts = "-ra --strict-markers --strict-config --doctest-modules -m 'not ibkr'"
asyncio_mode = "auto"
markers = [
    # Requires IB Gateway running and logged in. Skipped unless explicitly
    # selected, so the suite stays runnable on a laptop with nothing attached
    # and in CI, which has no broker.
    "ibkr: needs a live IB Gateway connection",
]
# A warning in this system is usually a correctness signal, not noise.
filterwarnings = ["error"]
