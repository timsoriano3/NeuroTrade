[project]
name = "neurotrade"
version = "0.0.0"
description = "Autonomous day-trading system for US and Canadian equities"
readme = "README.md"
requires-python = ">=3.12,<3.14"

# Deliberately empty. Every dependency is added by the commit that introduces the
# code needing it, so `git log -p pyproject.toml` reads as a history of why each
# one is here. Nothing in this commit imports anything.
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neurotrade"]

[tool.uv]
default-groups = ["dev"]

# ── Lint & format ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "TID",      # tidy imports
    "RUF",
    "ANN",      # missing annotations
    "DTZ",      # naive datetimes — see the wall-clock invariant in CLAUDE.md
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ── Types ────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

# ── Tests ────────────────────────────────────────────────────
[tool.pytest.ini_options]
# src is included so the `>>>` examples in docstrings run as tests. An example
# nobody executes drifts out of date and then actively misleads.
testpaths = ["tests", "src"]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
# A warning in this system is usually a correctness signal, not noise.
filterwarnings = ["error"]
