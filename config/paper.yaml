# Paper: live data, simulated fills against the real book, no capital (§10.1).
#
# Deliberately identical to live apart from allow_live_orders, so that anything
# discovered here transfers. A paper profile that diverges from live is a paper
# profile that proves nothing.

log_level: INFO

ibkr:
  # Gateway paper port. 4001 is live — a wrong port here connects to the wrong
  # account, and the failure is silent until an order is placed.
  port: 4002
  # Checked on every connection, so a Gateway logged into the wrong account is
  # caught by `neurotrade ibkr check` rather than by a surprising fill.
  account: DUT108414
