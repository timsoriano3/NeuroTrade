# Live: live data, real fills, real capital (§10.1).
#
# The only profile permitted to move money. Everything else about it should
# match paper — if this file grows settings that paper.yaml lacks, the paper
# results stop being evidence about live behaviour.

log_level: INFO
allow_live_orders: true

ibkr:
  # Gateway LIVE port. Stated explicitly because the default is 4002 (paper) —
  # a live profile silently inheriting a paper port would connect to the wrong
  # account and look like it worked.
  port: 4001
  # Deliberately blank until a live account exists. Blank disables the identity
  # check, which is the right default for a profile nothing is allowed to use
  # yet: allow_live_orders is the guard that matters here.
  account: ""
