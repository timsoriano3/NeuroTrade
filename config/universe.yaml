# The seed tradable universe — the symbol axis of the backfill crawler's work
# queue (TRADER_PLAN §12.1 stage 1).
#
# This is DATA, not configuration. It is deliberately not part of the config
# hash: it grows from the few dozen names here to a few thousand discovered
# ones, and folding it into the hash would churn the fingerprint stamped on
# every trade record each time a ticker was added. A run records
# `Universe.digest` instead.
#
# Membership here is a starting point, not a claim about what is worth trading.
# §12.1 stage 3 replaces the hand-listing with yfinance-derived universe
# history, and §5's Universe Selector eventually ranks candidates nightly.
#
# The venue is the LISTING venue, which is what makes a symbol unique — the
# same ticker trades in two currencies on two venues. It is not IBKR's exchange
# string; the adapter maps those (TSX becomes "TSE"). Nothing here has been
# confirmed against IBKR's contract database yet: the first crawl is what
# verifies it, and a symbol IBKR cannot resolve surfaces as an error rather
# than as silence.
#
# QUOTE ANY TICKER YAML WOULD READ AS SOMETHING ELSE. `ON` parses as the
# boolean true, `NO` and `OFF` as false — and `ON` is ON Semiconductor, a real
# NASDAQ listing. The loader rejects a non-string rather than coercing it, so
# the mistake is loud, but quoting avoids it in the first place.

version: 1

venues:
  NASDAQ:
    - AAPL
    - AMD
    - AMZN
    - GOOGL
    - INTC
    - META
    - MSFT
    - NFLX
    - NVDA
    - "ON" # ON Semiconductor — unquoted this is the boolean true
    - QQQ
    - TSLA

  NYSE:
    - BA
    - BAC
    - CVX
    - DIS
    - F
    - JNJ
    - JPM
    - KO
    - MA
    - PFE
    - TD # Toronto-Dominion in USD; the same company is below in CAD
    - UNH
    - V
    - WMT
    - XOM

  # Index and sector proxies. These are not trading candidates in their own
  # right — they are the REGRESSORS §5.4's beta-adjusted relative strength and
  # §5.5's index-relative residual reversion need. Both regress a name's
  # intraday return on the market plus its sector; without the sector leg the
  # residual still carries sector beta, which is the very thing those
  # strategies exist to strip out.
  #
  # The eleven SPDRs are the GICS sectors. They are used rather than per-name
  # GICS membership because they are tradable (so the residual is hedgeable),
  # and because point-in-time GICS history is licensed and would have to be
  # reconstructed from present-day membership — which is survivorship bias
  # wearing a classification's clothes.
  ARCA:
    - DIA # Dow proxy; also in the seed corpus, so it cross-checks FRD's bars
    - EEM # also in the seed corpus, same reason
    - IWM
    - SPY
    - XLB # materials
    - XLC # communication services
    - XLE # energy
    - XLF # financials
    - XLI # industrials
    - XLK # technology
    - XLP # consumer staples
    - XLRE # real estate
    - XLU # utilities
    - XLV # health care
    - XLY # consumer discretionary

  BATS:
    - VXX # volatility regime input (§5.7); Cboe BZX listing, which IBKR calls BATS

  TSX:
    - ABX
    - BCE
    - BMO
    - BNS
    - CM
    - CNQ
    - CNR
    - CP
    - ENB
    - RY
    - SHOP
    - SU
    - T # Telus. NYSE's "T" is AT&T — a different company, same ticker
    - TD
    - XIU # iShares S&P/TSX 60. The Canadian market leg: SPY does not price TSX
      # names, so without this the fourteen Canadian listings have nothing to
      # residualise against.
